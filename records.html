<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>保護者用・プレイ記録</title><style>body{font-family:system-ui,sans-serif;background:#f4f7f5;color:#243a33;margin:0;padding:24px}main{max-width:650px;margin:auto}.card{background:white;border:1px solid #d4ded8;border-radius:16px;padding:20px;margin:16px 0}h1{font-size:25px}p{line-height:1.7}a{color:#216b58}</style></head><body><main><h1>📋 保護者用・プレイ記録</h1><p>このページはMENUに表示されません。記録はこの端末・ブラウザに保存された分のみです。</p><div class="card" id="playstats">記録を確認しています…</div><p>※ 過去のStage1〜3の記録は対象外です。Safariのサイトデータを消すと記録も消えることがあります。</p><a href="./menu.html">ステージ選択に戻る</a></main><script>const out=[];for(const [name,key] of [['Stage4','kanji-craft-stage4-v1'],['Stage5','kanji-craft-stage5-v1']]){try{const s=JSON.parse(localStorage.getItem(key));if(s){const review=name==='Stage5'?Object.keys(s.reviewHistory||{}).join('・'):Object.entries(s.marks||{}).filter(([,v])=>v==='need').map(([i])=>['城','辺','低','念','縄','試','側','固','晴','改'][+i]).filter(Boolean).join('・');out.push(`${name}：開始 ${s.plays||0}回 ／ 完走 ${s.finishes||0}回 ／ 練習候補 ${review||'なし'}`)}}catch(e){}}document.getElementById('playstats').textContent=out.length?out.join('　｜　'):'このブラウザにはStage4・5の記録がありません。';</script></body></html>
